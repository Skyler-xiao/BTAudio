name: Bug report
description: Report a problem with BTAudio
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the headphones
        2. Start a game
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Bluetooth device
      placeholder: CMF Buds 2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BTAudio version
      placeholder: 0.5.0
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Enable the log in the plugin menu (Settings > Log > Write log, all topics enabled), reproduce the problem,
        then attach `wiiu/btaudio/plugin.txt` from the SD card.
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Other plugins and modules
      description: Other Aroma plugins or setup modules you have installed, if known
