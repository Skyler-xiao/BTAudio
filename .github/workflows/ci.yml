name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-binary:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wiiu-env/devkitppc:20260225
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: install build tools
      run: |
        apt-get update && apt-get install -y git zip
        dkp-pacman -Syu --noconfirm --needed devkitARM general-tools
        git clone https://github.com/wiiu-env/WiiUPluginSystem /tmp/wups && cd /tmp/wups && git checkout 0e26d9fd2d9db6c356c973a1a79000757802d883
        make -C /tmp/wups -j4 && mkdir -p $DEVKITPRO/wups && cp -r /tmp/wups/lib /tmp/wups/include /tmp/wups/share $DEVKITPRO/wups/
        git clone https://github.com/wiiu-env/libnotifications /tmp/notif && cd /tmp/notif && git checkout c7fc69e2f7a265fee017c87fe066b587c9e5003d
        make -C /tmp/notif -j4 && make -C /tmp/notif install
    - name: build binary
      env:
        DEVKITARM: /opt/devkitpro/devkitARM
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        make dist
    - uses: actions/upload-artifact@v7
      with:
       name: BTAudio_nightly
       path: dist/*.zip
